<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM Audio Soundboard - Klasseøvelse</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h1>Dyrelyde</h1>
        <section class="sound-buttons" aria-label="Knapper med dyrelyde">
            <button type="button" id="lion" class="playSoundBtn">Lion</button>
            <button type="button" id="dog" class="playSoundBtn">Dog</button>
            <button type="button" id="elephant" class="playSoundBtn">Elephant</button>
            <button type="button" id="monkey" class="playSoundBtn"> Monkey </button>

            <!--
            ===========================================================
            EKSTRAOPGAVE (når lion og dog virker): elephant og monkey
            ===========================================================
            E1. Tilføj en knap til elephant
                Brug lion- og dog-knappen ovenfor som skabelon.
                    id="elephant"   class="playSoundBtn"
                Knappens tekst skal være: Elephant

            E2. Tilføj en knap til monkey
                    id="monkey"     class="playSoundBtn"
                Knappens tekst skal være: Monkey

            Tænk over: hvorfor skal id'et være præcis "elephant" og "monkey"?
            (Hint: kig i script.js, hvordan knapperne bliver fundet.)

            Når du har lavet knapperne, kan du se dem på siden,
            men der sker ikke noget, når du klikker. Det løser du i script.js.
            -->
        </section>
    </main>

    <!-- Husk fra dag 1: skriv scriptet, der linker til js/script.js, herunder -->

<script src="/js/script.js"> </script>
</body>
</html>
